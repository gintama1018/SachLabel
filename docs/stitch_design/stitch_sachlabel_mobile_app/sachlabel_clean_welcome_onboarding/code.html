<script>
  function selectLang(lang) {
    document.getElementById('current-lang').innerText = lang;
    document.getElementById('lang-dropdown').classList.add('hidden');
  }

  document.addEventListener('click', function(event) {
    const dropdown = document.getElementById('lang-dropdown');
    const langBtn = document.getElementById('lang-btn');
    if (dropdown && !dropdown.contains(event.target) && !langBtn.contains(event.target)) {
      dropdown.classList.add('hidden');
    }
  });

  const ctaBtn = document.getElementById('cta-start-scan');
  if (ctaBtn) {
    ctaBtn.addEventListener('click', function() {
      ctaBtn.classList.add('opacity-90');
      setTimeout(() => ctaBtn.classList.remove('opacity-90'), 150);
    });
  }
